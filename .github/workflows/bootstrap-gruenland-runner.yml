name: bootstrap-gruenland-runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-runner:
    runs-on: [self-hosted, Linux, X64, hippoject-prod]
    steps:
      - name: Install Grünland backend runner on this VPS
        env:
          RUNNER_TOKEN: ${{ secrets.GRUENLAND_RUNNER_REGISTRATION_TOKEN }}
          REMOVE_TOKEN: ${{ secrets.GRUENLAND_RUNNER_REMOVE_TOKEN }}
          RUNNER_URL: https://github.com/valere-hippo/backend-gruenland-kartierung
          RUNNER_NAME: gruenland-backend-vps
          RUNNER_LABELS: gruenland-backend
          RUNNER_DIR: ${{ github.workspace }}/../actions-runner-gruenland-backend
        run: |
          set -euo pipefail
          if [ -z "${RUNNER_TOKEN:-}" ]; then
            echo "Missing secret GRUENLAND_RUNNER_REGISTRATION_TOKEN"
            exit 1
          fi
          if [ -z "${REMOVE_TOKEN:-}" ]; then
            echo "Missing secret GRUENLAND_RUNNER_REMOVE_TOKEN"
            exit 1
          fi

          RUNNER_DIR="$(realpath -m "$RUNNER_DIR")"
          mkdir -p "$RUNNER_DIR"
          cd "$RUNNER_DIR"

          if [ ! -f ./config.sh ]; then
            RUNNER_VERSION=$(python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('https://api.github.com/repos/actions/runner/releases/latest', timeout=30) as resp:
              tag = json.load(resp)['tag_name']
          print(tag.lstrip('v'))
          PY
          )
            curl -fsSL -o actions-runner.tar.gz \
              "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz"
            tar xzf actions-runner.tar.gz
            rm -f actions-runner.tar.gz
          fi

          echo "Stopping any old Grünland runner process in $RUNNER_DIR..."
          pgrep -af "$RUNNER_DIR" || true
          pkill -u "$USER" -f "$RUNNER_DIR" 2>/dev/null || true
          sleep 3
          echo "Remaining Grünland runner processes:"
          pgrep -af "$RUNNER_DIR" || true

          if [ -f ./.runner ]; then
            echo "Removing stale runner registration..."
            ./config.sh remove --token "$REMOVE_TOKEN" || true
          fi
          rm -f .runner .credentials .credentials_rsaparams

          echo "Registering Grünland runner..."
          ./config.sh \
            --url "$RUNNER_URL" \
            --token "$RUNNER_TOKEN" \
            --name "$RUNNER_NAME" \
            --labels "$RUNNER_LABELS" \
            --unattended \
            --replace

          echo "Starting Grünland runner in a detached session..."
          nohup setsid env -u RUNNER_TRACKING_ID bash -lc "cd '$RUNNER_DIR' && exec ./run.sh >> '$RUNNER_DIR/runner.log' 2>&1" </dev/null >/dev/null 2>&1 &
          disown || true

          sleep 10
          echo "Current Grünland runner processes:"
          pgrep -af "$RUNNER_DIR" || true
          echo "Grünland runner bootstrap finished. Recent log:"
          tail -80 "$RUNNER_DIR/runner.log" || true
