name: gruenland-deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy the stack or only print recent backend logs
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - logs

permissions:
  contents: read

concurrency:
  group: gruenland-direct-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, hippoject-prod]
    steps:
      - name: Ensure Grünland DNS record
        if: ${{ github.event.inputs.mode != 'logs' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ZONE_ID:-}"
          export TARGET_NAME="gruenland.hipposideros-cloud.com"
          export TARGET_IP="$(curl -fsS https://api.ipify.org)"
          python3 <<'PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ['CLOUDFLARE_API_TOKEN']
          zone = os.environ['CLOUDFLARE_ZONE_ID']
          name = os.environ['TARGET_NAME']
          ip = os.environ['TARGET_IP']
          headers = {
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
          }
          def request(method, url, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)
          q = urllib.parse.urlencode({'type': 'A', 'name': name})
          base = f'https://api.cloudflare.com/client/v4/zones/{zone}/dns_records'
          found = request('GET', f'{base}?{q}')['result']
          payload = {'type': 'A', 'name': name, 'content': ip, 'ttl': 1, 'proxied': False}
          if found:
              request('PUT', f"{base}/{found[0]['id']}", payload)
              print(f'Updated {name} -> {ip}')
          else:
              request('POST', base, payload)
              print(f'Created {name} -> {ip}')
          PY

      - name: Deploy Grünland backend stack on Hippoject VPS
        if: ${{ github.event.inputs.mode != 'logs' }}
        env:
          GRUENLAND_ENV_PRODUCTION: ${{ secrets.GRUENLAND_ENV_PRODUCTION }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_DIR: ${{ github.workspace }}/../gruenland-backend-direct-deploy
        run: |
          set -euo pipefail
          test -n "${GRUENLAND_ENV_PRODUCTION:-}"
          test -n "${GHCR_USERNAME:-}"
          test -n "${GHCR_TOKEN:-}"

          DEPLOY_DIR="$(realpath -m "$DEPLOY_DIR")"
          mkdir -p "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"

          cat > docker-compose.prod.yml <<'EOF'
          services:
            gruenland-api:
              image: ghcr.io/valere-hippo/backend-gruenland-kartierung:latest
              container_name: gruenland-api
              restart: unless-stopped
              depends_on:
                gruenland-mongo:
                  condition: service_healthy
              env_file:
                - .env.production
              environment:
                SPRING_PROFILES_ACTIVE: prod
                SERVER_PORT: 8080
                APP_PUBLIC_BASE_URL: https://gruenland.hipposideros-cloud.com
                LOCAL_STORAGE_DIR: /app/uploads
                MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@gruenland-mongo:27017/kartierungDB?authSource=admin
              volumes:
                - gruenland_uploads:/app/uploads
              labels:
                - traefik.enable=true
                - traefik.http.routers.gruenland-api.rule=Host(`gruenland.hipposideros-cloud.com`)
                - traefik.http.routers.gruenland-api.entrypoints=websecure
                - traefik.http.routers.gruenland-api.tls=true
                - traefik.docker.network=hippoject-edge
                - traefik.http.routers.gruenland-api.tls.certresolver=letsencrypt
                - traefik.http.services.gruenland-api.loadbalancer.server.port=8080
              networks:
                - edge
                - gruenland-internal

            gruenland-mongo:
              image: mongo:7
              container_name: gruenland-mongo
              restart: unless-stopped
              env_file:
                - .env.production
              volumes:
                - gruenland_mongo_data:/data/db
              healthcheck:
                test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' || exit 1"]
                interval: 10s
                timeout: 5s
                retries: 10
              networks:
                - gruenland-internal

          volumes:
            gruenland_mongo_data:
            gruenland_uploads:

          networks:
            edge:
              external: true
              name: hippoject-edge
            gruenland-internal:
              driver: bridge
          EOF

          printf '%s\n' "$GRUENLAND_ENV_PRODUCTION" > .env.production
          chmod 600 .env.production

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          docker compose --env-file .env.production -f docker-compose.prod.yml pull
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans
          docker compose --env-file .env.production -f docker-compose.prod.yml ps
          docker image prune -f

      - name: Show recent Grünland backend logs
        if: ${{ always() }}
        env:
          DEPLOY_DIR: ${{ github.workspace }}/../gruenland-backend-direct-deploy
        run: |
          set -euo pipefail
          DEPLOY_DIR="$(realpath -m "$DEPLOY_DIR")"
          if [ ! -d "$DEPLOY_DIR" ]; then
            echo "Deploy directory does not exist yet: $DEPLOY_DIR"
            exit 0
          fi
          cd "$DEPLOY_DIR"
          echo "Docker compose status:"
          docker compose --env-file .env.production -f docker-compose.prod.yml ps || true
          echo "Recent gruenland-api logs:"
          docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=300 gruenland-api || true
