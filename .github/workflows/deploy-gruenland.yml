name: gruenland-deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy the stack or only print recent backend logs
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - logs

permissions:
  contents: read

concurrency:
  group: gruenland-direct-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, hippoject-prod]
    steps:
      - name: Ensure Grünland DNS record
        if: ${{ github.event.inputs.mode != 'logs' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ZONE_ID:-}"
          export TARGET_NAME="gruenland.hipposideros-cloud.com"
          export TARGET_IP="$(curl -fsS https://api.ipify.org)"
          python3 <<'PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ['CLOUDFLARE_API_TOKEN']
          zone = os.environ['CLOUDFLARE_ZONE_ID']
          name = os.environ['TARGET_NAME']
          ip = os.environ['TARGET_IP']
          headers = {
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
          }
          def request(method, url, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)
          q = urllib.parse.urlencode({'type': 'A', 'name': name})
          base = f'https://api.cloudflare.com/client/v4/zones/{zone}/dns_records'
          found = request('GET', f'{base}?{q}')['result']
          payload = {'type': 'A', 'name': name, 'content': ip, 'ttl': 1, 'proxied': False}
          if found:
              request('PUT', f"{base}/{found[0]['id']}", payload)
              print(f'Updated {name} -> {ip}')
          else:
              request('POST', base, payload)
              print(f'Created {name} -> {ip}')
          PY

      - name: Deploy Grünland backend stack on Hippoject VPS
        if: ${{ github.event.inputs.mode != 'logs' }}
        env:
          GRUENLAND_ENV_PRODUCTION: ${{ secrets.GRUENLAND_ENV_PRODUCTION }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_DIR: ${{ github.workspace }}/../gruenland-backend-direct-deploy
        run: |
          set -euo pipefail
          test -n "${GRUENLAND_ENV_PRODUCTION:-}"
          test -n "${GHCR_USERNAME:-}"
          test -n "${GHCR_TOKEN:-}"

          DEPLOY_DIR="$(realpath -m "$DEPLOY_DIR")"
          mkdir -p "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"

          cat > docker-compose.prod.yml <<'EOF'
          services:
            gruenland-api:
              image: ghcr.io/valere-hippo/backend-gruenland-kartierung:latest
              container_name: gruenland-api
              restart: unless-stopped
              depends_on:
                gruenland-permissions:
                  condition: service_completed_successfully
                gruenland-mongo:
                  condition: service_healthy
              env_file:
                - .env.production
              environment:
                SPRING_PROFILES_ACTIVE: prod
                SERVER_PORT: 8080
                APP_PUBLIC_BASE_URL: https://gruenland.hipposideros-cloud.com
                LOCAL_STORAGE_DIR: /app/uploads
                MONGODB_URI: ${MONGODB_URI:-mongodb://${MONGO_INITDB_ROOT_USERNAME:-gruenland}:${MONGO_INITDB_ROOT_PASSWORD:-}@gruenland-mongo:27017/${MONGO_DATABASE:-kartierungDB}?authSource=${MONGO_AUTH_SOURCE:-admin}}
              volumes:
                - gruenland_uploads:/app/uploads
              labels:
                - traefik.enable=true
                - traefik.http.routers.gruenland-api.rule=Host(`gruenland.hipposideros-cloud.com`)
                - traefik.http.routers.gruenland-api.entrypoints=websecure
                - traefik.http.routers.gruenland-api.tls=true
                - traefik.docker.network=hippoject-edge
                - traefik.http.routers.gruenland-api.tls.certresolver=letsencrypt
                - traefik.http.services.gruenland-api.loadbalancer.server.port=8080
              networks:
                - edge
                - gruenland-internal

            gruenland-permissions:
              image: alpine:3.20
              restart: "no"
              command: >
                sh -c "mkdir -p /app/uploads/reports
                && chown -R 10001:10001 /app/uploads
                && chmod -R u+rwX,g+rwX /app/uploads"
              volumes:
                - gruenland_uploads:/app/uploads

            gruenland-mongo:
              image: mongo:7
              container_name: gruenland-mongo
              restart: unless-stopped
              env_file:
                - .env.production
              volumes:
                - gruenland_mongo_data:/data/db
              healthcheck:
                test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' || exit 1"]
                interval: 10s
                timeout: 5s
                retries: 10
              networks:
                - gruenland-internal

          volumes:
            gruenland_mongo_data:
            gruenland_uploads:

          networks:
            edge:
              external: true
              name: hippoject-edge
            gruenland-internal:
              driver: bridge
          EOF

          printf '%s\n' "$GRUENLAND_ENV_PRODUCTION" > .env.production
          chmod 600 .env.production

          # Normalize common secret names and reuse Hippoject SMTP values when Grünland-specific
          # values are not present. Values are appended without printing them.
          value_from_file() {
            local file="$1" key="$2"
            [ -f "$file" ] || return 0
            grep -E "^${key}=" "$file" | tail -n 1 | sed -E "s/^${key}=//"
          }
          first_value() {
            local key value file
            for key in "$@"; do
              value="$(value_from_file .env.production "$key")"
              if [ -n "$value" ]; then
                printf '%s' "$value"
                return 0
              fi
            done
          }
          append_if_missing() {
            local key="$1" value="$2"
            if ! grep -qE "^${key}=" .env.production && [ -n "$value" ]; then
              printf '%s=%s\n' "$key" "$value" >> .env.production
            fi
          }

          append_if_missing AWS_ACCESS_KEY_ID "$(first_value AWS_ACCESS_KEY_ID AWS_ACCESS_KEY AWS_S3_ACCESS_KEY)"
          append_if_missing AWS_SECRET_ACCESS_KEY "$(first_value AWS_SECRET_ACCESS_KEY AWS_SECRET_KEY AWS_S3_SECRET_KEY)"
          append_if_missing AWS_REGION "$(first_value AWS_REGION AWS_DEFAULT_REGION)"
          append_if_missing AWS_S3_BUCKET "$(first_value AWS_S3_BUCKET AWS_BUCKET_NAME S3_BUCKET_NAME)"
          append_if_missing OPENAI_API_KEY "$(first_value OPENAI_API_KEY OPENAI_KEY OPEN_AI_API_KEY)"
          append_if_missing MONGO_DATABASE "$(first_value MONGO_DATABASE MONGODB_DATABASE)"

          HIPPOJECT_ENV_CANDIDATES=(
            "${{ secrets.DEPLOY_PATH }}/.env.production"
            "/opt/hippoject-infra/.env.production"
            "${{ github.workspace }}/../hippoject-infra/.env.production"
          )
          for key in EMAIL_NOTIFICATIONS_ENABLED SMTP_SERVER SMTP_PORT EMAIL PASSWORD; do
            if grep -qE "^${key}=" .env.production; then
              continue
            fi
            for candidate in "${HIPPOJECT_ENV_CANDIDATES[@]}"; do
              value="$(value_from_file "$candidate" "$key")"
              if [ -n "$value" ]; then
                printf '%s=%s\n' "$key" "$value" >> .env.production
                break
              fi
            done
          done

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          docker compose --env-file .env.production -f docker-compose.prod.yml pull
          docker compose --env-file .env.production -f docker-compose.prod.yml rm -f -s gruenland-permissions || true
          docker compose --env-file .env.production -f docker-compose.prod.yml run --rm --no-deps gruenland-permissions
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans
          docker compose --env-file .env.production -f docker-compose.prod.yml ps
          docker image prune -f

      - name: Show recent Grünland backend logs
        if: ${{ always() }}
        env:
          DEPLOY_DIR: ${{ github.workspace }}/../gruenland-backend-direct-deploy
        run: |
          set -euo pipefail
          DEPLOY_DIR="$(realpath -m "$DEPLOY_DIR")"
          if [ ! -d "$DEPLOY_DIR" ]; then
            echo "Deploy directory does not exist yet: $DEPLOY_DIR"
            exit 0
          fi
          cd "$DEPLOY_DIR"
          echo "Docker compose status:"
          docker compose --env-file .env.production -f docker-compose.prod.yml ps || true
          echo "Recent gruenland-api logs:"
          docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=300 gruenland-api || true
