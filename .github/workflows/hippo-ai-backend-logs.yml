name: hippo-ai-backend-logs

on:
  workflow_dispatch:
    inputs:
      container_name:
        description: 'Docker container name to inspect'
        required: false
        default: 'hippo-ai-api'
        type: string
      tail_lines:
        description: 'Number of log lines to display'
        required: false
        default: '200'
        type: string

permissions:
  contents: read

concurrency:
  group: hippo-ai-backend-logs
  cancel-in-progress: true

jobs:
  logs:
    runs-on: [self-hosted, Linux, X64, hippoject-prod]
    timeout-minutes: 15

    steps:
      - name: Show latest backend logs
        shell: bash
        run: |
          set -euo pipefail

          container_name='${{ inputs.container_name || 'hippo-ai-api' }}'
          tail_lines='${{ inputs.tail_lines || '200' }}'

          if ! [[ "$tail_lines" =~ ^[0-9]+$ ]]; then
            echo "tail_lines must be a positive integer" >&2
            exit 1
          fi

          if docker ps >/dev/null 2>&1; then
            DOCKER=docker
          elif sudo -n docker ps >/dev/null 2>&1; then
            DOCKER='sudo docker'
          else
            echo "Docker is not accessible for this runner user." >&2
            echo "Who am I?" >&2
            id >&2 || true
            echo "Groups:" >&2
            groups >&2 || true
            exit 1
          fi

          echo "=== Docker containers on host ==="
          $DOCKER ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          echo
          echo "=== Backend log target ==="
          echo "container_name=$container_name"
          echo "tail_lines=$tail_lines"
          echo

          if ! $DOCKER inspect "$container_name" >/dev/null 2>&1; then
            echo "Container '$container_name' was not found on this host." >&2
            echo "Available containers:" >&2
            $DOCKER ps -a --format '{{.Names}}' >&2
            exit 1
          fi

          echo "=== Last ${tail_lines} lines from ${container_name} ==="
          $DOCKER logs "$container_name" --timestamps --tail "$tail_lines"
