name: Provision Hippo AI VPS

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Model provider to configure on the VPS"
        required: true
        type: choice
        options:
          - openai
          - claude
      api_key:
        description: "API key for the selected provider"
        required: true
        type: string
      server_name:
        description: "Hetzner server name"
        required: false
        type: string
        default: "hippo-ai-prod"
      server_type:
        description: "Hetzner server type (use CCX* if shared-core quota is exhausted)"
        required: false
        type: string
        default: "ccx23"
      location:
        description: "Hetzner location"
        required: false
        type: string
        default: "fsn1"
      image:
        description: "Hetzner image"
        required: false
        type: string
        default: "ubuntu-24.04"
      public_hostname:
        description: "Public hostname for the VPS"
        required: false
        type: string
        default: "hippo-api.hipposideros-cloud.de"
      dns_ttl:
        description: "DNS TTL in seconds"
        required: false
        type: string
        default: "300"
      force_recreate:
        description: "Delete an existing server with the same name before provisioning"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: provision-hippo-ai-vps
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      HIPPO_AI_BASE_URL: ${{ secrets.HIPPO_AI_BASE_URL }}
      HIPPO_AI_MODEL: ${{ secrets.HIPPO_AI_MODEL }}
      PCLOUD_ACCESS_TOKEN: ${{ secrets.PCLOUD_ACCESS_TOKEN }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      DEBUG_SSH_PRIVATE_KEY_PATH: /tmp/hippo-ai-debug-key
      DEBUG_SSH_PUBLIC_KEY_PATH: /tmp/hippo-ai-debug-key.pub
      INPUT_PROVIDER: ${{ inputs.provider }}
      INPUT_API_KEY: ${{ inputs.api_key }}
      INPUT_SERVER_NAME: ${{ inputs.server_name }}
      INPUT_SERVER_TYPE: ${{ inputs.server_type }}
      INPUT_LOCATION: ${{ inputs.location }}
      INPUT_IMAGE: ${{ inputs.image }}
      INPUT_PUBLIC_HOSTNAME: ${{ inputs.public_hostname }}
      INPUT_DNS_TTL: ${{ inputs.dns_ttl }}
      INPUT_FORCE_RECREATE: ${{ inputs.force_recreate }}
    steps:
      - name: Generate ephemeral SSH key for diagnostics
        run: |
          ssh-keygen -t ed25519 -f /tmp/hippo-ai-debug-key -N "" -C "hippo-ai-debug-${{ github.run_id }}"
          echo "DEBUG_SSH_PRIVATE_KEY_PATH=/tmp/hippo-ai-debug-key" >> "$GITHUB_ENV"
          echo "DEBUG_SSH_PUBLIC_KEY_PATH=/tmp/hippo-ai-debug-key.pub" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - id: provision
        name: Provision Hippo AI VPS
        run: python3 scripts/provision_hippo_ai_vps.py
