name: hippoject-terraform

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Terraform action to run
        required: true
        default: plan
        type: choice
        options:
          - import
          - plan
          - apply
      root_domain:
        description: Public root domain
        required: true
        default: hipposideros-cloud.de
        type: string
      project_name:
        description: Project prefix used for Terraform resources
        required: true
        default: hippoject
        type: string
      server_type:
        description: Hetzner server type
        required: true
        default: cpx62
        type: string
      server_image:
        description: Hetzner server image
        required: true
        default: ubuntu-24.04
        type: string
      server_location:
        description: Hetzner location
        required: true
        default: nbg1
        type: string
      volume_size_gb:
        description: Persistent volume size in GB
        required: true
        default: '80'
        type: string
      terraform_version:
        description: Terraform CLI version
        required: true
        default: 1.9.8
        type: string
      enable_backups:
        description: Enable Hetzner backups
        required: true
        default: true
        type: boolean
      cloudflare_proxied:
        description: Proxy public DNS records through Cloudflare
        required: true
        default: false
        type: boolean
      admin_ipv4_cidrs_json:
        description: JSON array of IPv4 CIDRs allowed for SSH and any admin-only firewall rules
        required: true
        default: '["0.0.0.0/0"]'
        type: string
      admin_ipv6_cidrs_json:
        description: JSON array of IPv6 CIDRs allowed for SSH and any admin-only firewall rules
        required: true
        default: '["::/0"]'
        type: string
      import_existing_state:
        description: Import matching existing Hetzner and Cloudflare resources into Terraform state before planning
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: hippoject-terraform
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: [self-hosted, Linux, X64, hippoject-prod]
    defaults:
      run:
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform CLI
        run: |
          set -euo pipefail
          VERSION='${{ inputs.terraform_version }}'
          INSTALL_DIR="$HOME/.local/bin"
          mkdir -p "$INSTALL_DIR"
          curl -fsSL "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
          python3 - <<'PY'
          import zipfile
          zf = zipfile.ZipFile('/tmp/terraform.zip')
          zf.extractall('/tmp/terraform-bin')
          PY
          install -m 0755 /tmp/terraform-bin/terraform "$INSTALL_DIR/terraform"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
          "$INSTALL_DIR/terraform" version

      - name: Restore persistent Terraform state
        run: |
          STATE_DIR="$HOME/.terraform-state/hippoject-infra"
          mkdir -p "$STATE_DIR"
          if [ -f "$STATE_DIR/terraform.tfstate" ]; then
            cp "$STATE_DIR/terraform.tfstate" ./terraform.tfstate
          fi
          if [ -f "$STATE_DIR/terraform.tfstate.backup" ]; then
            cp "$STATE_DIR/terraform.tfstate.backup" ./terraform.tfstate.backup
          fi

      - name: Render workflow tfvars
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          test -n "$HCLOUD_TOKEN"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ZONE_ID"
          test -n "$SSH_PUBLIC_KEY"
          cat > workflow.auto.tfvars <<EOF
          hcloud_token         = "$HCLOUD_TOKEN"
          cloudflare_api_token = "$CLOUDFLARE_API_TOKEN"
          cloudflare_zone_id   = "$CLOUDFLARE_ZONE_ID"
          cloudflare_proxied   = ${{ inputs.cloudflare_proxied }}
          project_name         = "${{ inputs.project_name }}"
          root_domain          = "${{ inputs.root_domain }}"
          server_type          = "${{ inputs.server_type }}"
          server_image         = "${{ inputs.server_image }}"
          server_location      = "${{ inputs.server_location }}"
          volume_size_gb       = ${{ inputs.volume_size_gb }}
          enable_backups       = ${{ inputs.enable_backups }}
          ssh_public_key       = "$SSH_PUBLIC_KEY"
          admin_ipv4_cidrs     = ${{ inputs.admin_ipv4_cidrs_json }}
          admin_ipv6_cidrs     = ${{ inputs.admin_ipv6_cidrs_json }}
          EOF

      - name: Terraform init
        run: terraform init

      - name: Import existing infrastructure into state
        if: ${{ inputs.import_existing_state || inputs.mode == 'import' }}
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          ROOT_DOMAIN: ${{ inputs.root_domain }}
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          set -euo pipefail
          python3 <<'PY' > /tmp/import-env.sh
          import json
          import os
          import socket
          import sys
          import urllib.parse
          import urllib.request

          def fetch_json(url, headers):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          root_domain = os.environ['ROOT_DOMAIN']
          project_name = os.environ['PROJECT_NAME']
          zone_id = os.environ['CLOUDFLARE_ZONE_ID']
          hcloud_headers = {
              'Authorization': f"Bearer {os.environ['HCLOUD_TOKEN']}",
              'Content-Type': 'application/json',
          }
          cf_headers = {
              'Authorization': f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}",
              'Content-Type': 'application/json',
          }

          target_names = {
              'server': f'{project_name}-prod',
              'firewall': f'{project_name}-firewall',
              'volume': f'{project_name}-data',
              'ssh_key': f'{project_name}-bootstrap',
          }
          dns_names = {
              'auth': f'auth.{root_domain}',
              'hippoject': f'hippoject.{root_domain}',
              'hippoject_api': f'hippoject-api.{root_domain}',
              'monitoring': f'monitoring.{root_domain}',
          }

          target_ip = None
          try:
              target_ip = socket.gethostbyname(dns_names['hippoject'])
          except Exception:
              pass

          servers = fetch_json('https://api.hetzner.cloud/v1/servers', hcloud_headers).get('servers', [])
          firewalls = fetch_json('https://api.hetzner.cloud/v1/firewalls', hcloud_headers).get('firewalls', [])
          volumes = fetch_json('https://api.hetzner.cloud/v1/volumes', hcloud_headers).get('volumes', [])
          ssh_keys = fetch_json('https://api.hetzner.cloud/v1/ssh_keys', hcloud_headers).get('ssh_keys', [])

          server = next((s for s in servers if s.get('name') == target_names['server']), None)
          if server is None and target_ip is not None:
              for candidate in servers:
                  ipv4 = ((candidate.get('public_net') or {}).get('ipv4') or {}).get('ip')
                  if ipv4 == target_ip:
                      server = candidate
                      break

          firewall = next((f for f in firewalls if f.get('name') == target_names['firewall']), None)
          volume = next((v for v in volumes if v.get('name') == target_names['volume']), None)
          ssh_key = next((k for k in ssh_keys if k.get('name') == target_names['ssh_key']), None)

          print('#!/usr/bin/env bash')
          print('set -euo pipefail')
          if target_ip:
              print(f'export DISCOVERED_TARGET_IP={json.dumps(target_ip)}')
          if server:
              print(f'export HCLOUD_SERVER_ID={server["id"]}')
          if firewall:
              print(f'export HCLOUD_FIREWALL_ID={firewall["id"]}')
          if volume:
              print(f'export HCLOUD_VOLUME_ID={volume["id"]}')
          if ssh_key:
              print(f'export HCLOUD_SSH_KEY_ID={ssh_key["id"]}')

          for key, fqdn in dns_names.items():
              params = urllib.parse.urlencode({'type': 'A', 'name': fqdn, 'per_page': 100})
              records = fetch_json(f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records?{params}', cf_headers).get('result', [])
              if records:
                  print(f'export CF_RECORD_{key.upper()}={json.dumps(records[0]["id"])}')
          PY
          source /tmp/import-env.sh

          import_if_missing() {
            local address="$1"
            local import_id="$2"
            if terraform state show "$address" >/dev/null 2>&1; then
              echo "Already in state: $address"
              return
            fi
            echo "Importing $address"
            terraform import "$address" "$import_id"
          }

          if [ -n "${HCLOUD_SSH_KEY_ID:-}" ]; then
            import_if_missing hcloud_ssh_key.bootstrap "$HCLOUD_SSH_KEY_ID"
          else
            echo 'No matching Hetzner SSH key found for import'
          fi

          if [ -n "${HCLOUD_SERVER_ID:-}" ]; then
            import_if_missing hcloud_server.hippoject "$HCLOUD_SERVER_ID"
          else
            echo 'No matching Hetzner server found for import' >&2
          fi

          if [ -n "${HCLOUD_FIREWALL_ID:-}" ]; then
            import_if_missing hcloud_firewall.hippoject "$HCLOUD_FIREWALL_ID"
            import_if_missing hcloud_firewall_attachment.hippoject "$HCLOUD_FIREWALL_ID"
          else
            echo 'No matching Hetzner firewall found for import'
          fi

          if [ -n "${HCLOUD_VOLUME_ID:-}" ]; then
            import_if_missing hcloud_volume.hippoject "$HCLOUD_VOLUME_ID"
          else
            echo 'No matching Hetzner volume found for import'
          fi

          for record_key in AUTH HIPPOJECT HIPPOJECT_API MONITORING; do
            record_id_var="CF_RECORD_${record_key}"
            record_id="${!record_id_var:-}"
            tf_key=$(echo "$record_key" | tr 'A-Z' 'a-z')
            if [ -n "$record_id" ]; then
              import_if_missing "cloudflare_dns_record.a_records[\"$tf_key\"]" "$CLOUDFLARE_ZONE_ID/$record_id"
            else
              echo "No matching Cloudflare record found for $tf_key"
            fi
          done

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: ${{ inputs.mode != 'import' }}
        run: terraform plan -out=tfplan

      - name: Block unsafe apply when state is missing
        if: ${{ inputs.mode == 'apply' }}
        run: |
          set -euo pipefail
          terraform show -no-color tfplan > /tmp/tfplan.txt
          if grep -Fq '# hcloud_server.hippoject will be created' /tmp/tfplan.txt; then
            echo 'Refusing apply because Terraform would create the production server, which indicates missing state import.' >&2
            exit 1
          fi
          if grep -Fq '# hcloud_volume.hippoject will be created' /tmp/tfplan.txt; then
            echo 'Warning: Terraform would create the production volume. Import existing resources before apply.' >&2
            exit 1
          fi

      - name: Terraform apply
        if: ${{ inputs.mode == 'apply' }}
        run: terraform apply -auto-approve tfplan

      - name: Show Terraform outputs
        if: ${{ inputs.mode == 'apply' }}
        run: terraform output

      - name: Persist Terraform state
        if: always()
        run: |
          STATE_DIR="$HOME/.terraform-state/hippoject-infra"
          mkdir -p "$STATE_DIR"
          if [ -f terraform.tfstate ]; then
            cp terraform.tfstate "$STATE_DIR/terraform.tfstate"
          fi
          if [ -f terraform.tfstate.backup ]; then
            cp terraform.tfstate.backup "$STATE_DIR/terraform.tfstate.backup"
          fi

      - name: Cleanup workflow files
        if: always()
        run: rm -f workflow.auto.tfvars tfplan /tmp/import-env.sh /tmp/tfplan.txt
